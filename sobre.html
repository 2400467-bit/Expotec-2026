<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var t = localStorage.getItem('caneta3d-theme');
  if(t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="topbar-actions">
      <div class="lang-switch" role="group" aria-label="Selecionar idioma">
        <button class="lang-btn" data-lang="pt" onclick="trocarIdioma('pt')">PT</button>
        <button class="lang-btn" data-lang="en" onclick="trocarIdioma('en')">EN</button>
        <button class="lang-btn" data-lang="es" onclick="trocarIdioma('es')">ES</button>
      </div>
      <button class="theme-toggle" id="themeToggle" data-i18n-attr="aria-label:theme.toggle,title:theme.toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">

      </button>
      <button class="menu-toggle" onclick="toggleMenu()" aria-expanded="false" aria-controls="menuOpcoes">
        <span class="hamburger"><span></span><span></span><span></span></span>
        Menu
      </button>
    </div>
  </div>
  <nav class="menu-opcoes" id="menuOpcoes">

  </nav>
